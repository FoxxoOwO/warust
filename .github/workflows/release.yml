name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: warust.exe
            asset_suffix: windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: warust
            asset_suffix: linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: warust
            asset_suffix: macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: warust
            asset_suffix: macos-x86_64.tar.gz

    env:
      # Single source of truth for asset naming: the tag that triggered the run.
      VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libasound2-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a "../../../warust-${VERSION}-${{ matrix.asset_suffix }}" ${{ matrix.artifact_name }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf "../../../warust-${VERSION}-${{ matrix.asset_suffix }}" ${{ matrix.artifact_name }}

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.VERSION }}
          files: warust-${{ env.VERSION }}-${{ matrix.asset_suffix }}
          token: ${{ secrets.GITHUB_TOKEN }}
